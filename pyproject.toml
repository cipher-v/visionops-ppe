[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visionops-ppe"
version = "0.1.0"
description = "A production-oriented computer vision system for PPE compliance monitoring."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "matplotlib==3.11.2",
    "lap==0.5.12",
    "numpy==2.5.4",
    "opencv-python==5.0.0.93",
    "Pillow==13.0.0",
    "PyYAML==6.0.3",
    "torch==2.5.1",
    "torchvision==0.20.1",
    "ultralytics==8.4.212",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
]
deployment = [
    "onnx==1.19.1",
    "onnxruntime-gpu==1.23.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"
pythonpath = [".", "src"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "scripts", "tests"]
extend-exclude = [".tmp", ".venv", "data", "results"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

